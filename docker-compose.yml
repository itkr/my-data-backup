# Docker Compose for my-data-backup

services:
  # CLI用サービス
  my-data-backup-cli:
    build: .
    # make docker-build-image と同じイメージを使う
    image: my-data-backup:latest
    container_name: my-data-backup-cli
    volumes:
      # データディレクトリをマウント
      - ./data:/data
      # 設定やログの永続化
      - ./logs:/app/logs
      # ソースを差し替えられるようにマウント
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]  # コンテナを起動状態に保つ

  # GUI用サービス（X11フォワーディングが必要）
  my-data-backup-gui:
    build: .
    image: my-data-backup:latest
    container_name: my-data-backup-gui
    volumes:
      # X11ソケットをマウント（macOS/Linux）
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # データディレクトリをマウント
      - ./data:/data
      # 設定やログの永続化
      - ./logs:/app/logs
      # ソースを差し替えられるようにマウント
      - ./src:/app/src
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONPATH=/app
    network_mode: host
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]  # GUIは docker exec で起動する

volumes:
  data:
    driver: local
  logs:
    driver: local
